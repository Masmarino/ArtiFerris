<div class="container">
  <gbt-tabs>
    <gbt-tab [label]="'account.tabs.profile' | transloco">
      <div class="stack">
        <gbt-card [heading]="'account.profile.infoHeading' | transloco" icon="user">
          <div class="stack">
            <p>{{ 'account.profile.username' | transloco: { username: me.username() } }}</p>
            @if (me.isSuperAdmin()) {
              <p>{{ 'account.profile.superAdminStatus' | transloco }}</p>
            }
            <p>
              {{
                'account.profile.memberSince' | transloco: { date: me.createdAt() | date: 'medium' }
              }}
            </p>
          </div>
        </gbt-card>

        <gbt-card [heading]="'account.password.heading' | transloco" icon="lock">
          <form class="stack" [formGroup]="form" (ngSubmit)="submit()">
            <p class="gbt-form-required-note">
              {{ 'common.requiredNote' | transloco }}
            </p>
            <gbt-input
              [label]="'account.password.current' | transloco"
              type="password"
              [showPasswordLabel]="'common.showPassword' | transloco"
              [hidePasswordLabel]="'common.hidePassword' | transloco"
              formControlName="currentPassword"
              [required]="true"
              autocomplete="current-password"
            />
            <gbt-input
              [label]="'account.password.new' | transloco"
              type="password"
              [showPasswordLabel]="'common.showPassword' | transloco"
              [hidePasswordLabel]="'common.hidePassword' | transloco"
              formControlName="newPassword"
              [required]="true"
              autocomplete="new-password"
              [errorMessage]="newPasswordError"
            />
            <gbt-input
              [label]="'account.password.confirm' | transloco"
              type="password"
              [showPasswordLabel]="'common.showPassword' | transloco"
              [hidePasswordLabel]="'common.hidePassword' | transloco"
              formControlName="confirmPassword"
              [required]="true"
              autocomplete="new-password"
              [errorMessage]="confirmPasswordError"
            />
            <gbt-button
              [text]="'account.password.heading' | transloco"
              type="submit"
              [loading]="submitting()"
              [loadingLabel]="'common.loadingLabel' | transloco"
              [disabled]="form.invalid || submitting()"
            />
          </form>
        </gbt-card>
      </div>
    </gbt-tab>

    <gbt-tab [label]="'account.tabs.security' | transloco">
      <div class="stack">
        <app-mfa-settings />
        <app-passkey-settings />
        <app-session-settings />
      </div>
    </gbt-tab>

    <gbt-tab [label]="'account.tabs.tokens' | transloco">
      <gbt-card [heading]="'account.tokens.heading' | transloco" icon="key">
        <app-api-tokens-list />
      </gbt-card>
    </gbt-tab>
  </gbt-tabs>
</div>
