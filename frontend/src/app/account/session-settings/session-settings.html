<gbt-card [heading]="'account.sessions.heading' | transloco" icon="lock">
  <div class="stack">
    <p>
      {{ 'account.sessions.description' | transloco }}
    </p>
    <gbt-button
      class="w-content"
      [text]="'account.sessions.signOutEverywhere' | transloco"
      variant="danger"
      [loading]="signingOut()"
      [loadingLabel]="'common.loadingLabel' | transloco"
      (clicked)="logoutEverywhere()"
    />
  </div>
</gbt-card>
