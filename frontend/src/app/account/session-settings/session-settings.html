<gbt-card
  variant="outlined"
  icon="log-out"
  [heading]="'account.sessions.heading' | transloco"
  [description]="'account.sessions.description' | transloco"
>
  <div class="session-settings__actions">
    <gbt-button
      [text]="'account.sessions.signOutEverywhere' | transloco"
      variant="danger"
      iconName="log-out"
      [loading]="signingOut()"
      [loadingLabel]="'common.loadingLabel' | transloco"
      (clicked)="logoutEverywhere()"
    />
  </div>
</gbt-card>
