<gbt-modal
  [isOpen]="true"
  [heading]="heading()"
  [closeLabel]="'common.close' | transloco"
  (closed)="cancelled.emit()"
>
  <p>{{ message() }}</p>
  <gbt-button
    [text]="confirmLabel()"
    [loading]="confirming()"
    [loadingLabel]="'common.loadingLabel' | transloco"
    (clicked)="confirmed.emit()"
  />
</gbt-modal>
