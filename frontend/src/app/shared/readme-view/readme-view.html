<gbt-card class="readme-view">
  <h2 class="readme-view__title">README</h2>
  @if (content(); as html) {
    <div class="readme-view__content" [innerHTML]="html"></div>
  } @else {
    <gbt-empty-state
      illustration="book"
      heading="Aucun README"
      message="Ce package n'a pas de README."
    />
  }
</gbt-card>
