<gbt-card class="readme-view">
  <h2 class="readme-view__title">{{ 'shared.readme.title' | transloco }}</h2>
  @if (content(); as html) {
    <div #body class="readme-view__content" [innerHTML]="html"></div>
  } @else {
    <gbt-empty-state
      illustration="book"
      [heading]="'shared.readme.emptyHeading' | transloco"
      [message]="'shared.readme.emptyMessage' | transloco"
    />
  }
</gbt-card>
