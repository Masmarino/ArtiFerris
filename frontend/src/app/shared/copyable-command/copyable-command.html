<div class="copyable-command">
  <!-- A long command scrolls sideways, which the keyboard can only do once the block takes focus (WCAG 2.1.1). -->
  <pre
    tabindex="0"
    role="region"
    [attr.aria-label]="'common.command' | transloco"
  ><code>{{ command() }}</code></pre>
  <gbt-button
    variant="secondary"
    size="small"
    [text]="'common.copy' | transloco"
    [iconName]="copyState() === 'copied' ? 'check' : 'copy'"
    [ariaLabel]="label()"
    (clicked)="copy()"
  />
</div>
<span class="sr-only" aria-live="polite">{{ copyAnnouncement() }}</span>
