@if (confirm.pending(); as pending) {
  @if (pending.options.typeToConfirm; as text) {
    <gbt-confirm-danger-modal
      [isOpen]="true"
      [heading]="pending.options.heading"
      [message]="pending.options.message"
      [confirmText]="text"
      [confirmInputLabel]="'confirm.typeToConfirm' | transloco: { text }"
      [confirmLabel]="pending.options.confirmLabel ?? ('common.confirm' | transloco)"
      [cancelLabel]="pending.options.cancelLabel ?? ('common.cancel' | transloco)"
      [closeLabel]="'common.close' | transloco"
      (confirmed)="confirm.answer(true)"
      (closed)="confirm.answer(false)"
    />
  } @else {
    <gbt-modal
      [isOpen]="true"
      [heading]="pending.options.heading"
      [closeLabel]="'common.close' | transloco"
      (closed)="confirm.answer(false)"
    >
      <p>{{ pending.options.message }}</p>
      <div class="confirm-host__actions">
        <gbt-button
          variant="secondary"
          [text]="pending.options.cancelLabel ?? ('common.cancel' | transloco)"
          (clicked)="confirm.answer(false)"
        />
        <gbt-button
          [variant]="pending.options.danger ? 'danger' : 'primary'"
          [text]="pending.options.confirmLabel ?? ('common.confirm' | transloco)"
          (clicked)="confirm.answer(true)"
        />
      </div>
    </gbt-modal>
  }
}
