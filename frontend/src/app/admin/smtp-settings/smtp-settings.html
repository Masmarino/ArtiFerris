<div class="form-container">
  <gbt-card [heading]="'admin.smtp.heading' | transloco" icon="mail">
    @if (loading()) {
      <gbt-spinner [label]="'common.loading' | transloco" />
    } @else if (loadFailed()) {
      <p class="gbt-form-error" role="alert">{{ 'admin.smtp.loadFailed' | transloco }}</p>
    } @else {
      @if (secretUnreadable()) {
        <gbt-alert variant="warning">
          {{ 'admin.smtp.secretUnreadable' | transloco }}
        </gbt-alert>
      }
      <gbt-input
        [label]="'admin.smtp.host' | transloco"
        [ngModel]="host()"
        (ngModelChange)="host.set($event)"
        [errorMessage]="hostError()"
      />
      <gbt-input
        [label]="'admin.smtp.port' | transloco"
        [ngModel]="port()"
        (ngModelChange)="port.set($event)"
        [errorMessage]="portError()"
      />
      <gbt-input
        [label]="'admin.smtp.username' | transloco"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        [errorMessage]="usernameError()"
      />
      <gbt-input
        [label]="'auth.login.password' | transloco"
        type="password"
        [showPasswordLabel]="'common.showPassword' | transloco"
        [hidePasswordLabel]="'common.hidePassword' | transloco"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        [errorMessage]="passwordError()"
        [placeholder]="passwordSet() ? ('admin.orgDetail.keepPassword' | transloco) : ''"
      />
      <gbt-input
        [label]="'admin.smtp.fromName' | transloco"
        [ngModel]="fromName()"
        (ngModelChange)="fromName.set($event)"
        [errorMessage]="fromNameError()"
        placeholder="ArtiFerris"
      />
      <gbt-input
        [label]="'admin.smtp.fromAddress' | transloco"
        [ngModel]="fromAddress()"
        (ngModelChange)="fromAddress.set($event)"
        [errorMessage]="fromAddressError()"
      />
      <gbt-select
        [label]="'package.security' | transloco"
        [placeholder]="'common.select' | transloco"
        [options]="securityOptions"
        [ngModel]="security()"
        (ngModelChange)="security.set($event)"
      />

      <gbt-button
        [text]="'common.save' | transloco"
        [loading]="saving()"
        [disabled]="hasErrors()"
        (clicked)="save()"
        [loadingLabel]="'common.loadingLabel' | transloco"
      />
    }
  </gbt-card>

  @if (!loading()) {
    <gbt-card [heading]="'admin.smtp.testHeading' | transloco" icon="send">
      <gbt-input
        [label]="'admin.smtp.recipient' | transloco"
        [ngModel]="testRecipient()"
        (ngModelChange)="testRecipient.set($event)"
      />
      <gbt-tooltip [text]="'admin.smtp.testHint' | transloco">
        <gbt-button
          [text]="'admin.smtp.send' | transloco"
          variant="secondary"
          [loading]="sendingTest()"
          [loadingLabel]="'common.loadingLabel' | transloco"
          [disabled]="testRecipient().trim() === ''"
          (clicked)="sendTest()"
        />
      </gbt-tooltip>
    </gbt-card>
  }
</div>
