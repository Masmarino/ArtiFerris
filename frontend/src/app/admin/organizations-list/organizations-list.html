<gbt-button text="Nouvelle organisation" (clicked)="showCreateModal.set(true)" />
@if (loading()) {
  <div class="loading-state"><gbt-spinner label="Chargement…" /></div>
} @else if (error(); as message) {
  <p class="gbt-form-error" role="alert">{{ message }}</p>
} @else {
  @if (organizations().length === 0) {
    <gbt-empty-state
      illustration="checklist"
      heading="Aucune organisation"
      message="Créez une organisation pour y regrouper des dépôts et des membres."
    >
      <gbt-button text="Nouvelle organisation" (clicked)="showCreateModal.set(true)" />
    </gbt-empty-state>
  } @else {
    <gbt-table
      caption="Organisations"
      [clickableRows]="true"
      [data]="organizations()"
      [columns]="columns"
      [trackBy]="rowId"
      (rowClick)="openDetail($event)"
    />
  }
}
@if (showCreateModal()) {
  <app-create-organization-modal
    (created)="onOrganizationCreated()"
    (cancelled)="showCreateModal.set(false)"
  />
}
