<gbt-button
  [text]="'admin.organizations.newShort' | transloco"
  (clicked)="showCreateModal.set(true)"
/>
@if (loading()) {
  <div class="loading-state"><gbt-spinner [label]="'common.loading' | transloco" /></div>
} @else if (error(); as message) {
  <p class="gbt-form-error" role="alert">{{ message }}</p>
} @else {
  @if (organizations().length === 0) {
    <gbt-empty-state
      illustration="checklist"
      [heading]="'admin.organizations.emptyHeading' | transloco"
      [message]="'admin.organizations.emptyMessage' | transloco"
    >
      <gbt-button
        [text]="'admin.organizations.newShort' | transloco"
        (clicked)="showCreateModal.set(true)"
      />
    </gbt-empty-state>
  } @else {
    <gbt-table
      [caption]="'admin.organizations.caption' | transloco"
      [clickableRows]="true"
      [data]="organizations()"
      [columns]="columns"
      [trackBy]="rowId"
      (rowClick)="openDetail($event)"
    />
  }
}
@if (showCreateModal()) {
  <app-create-organization-modal
    (created)="onOrganizationCreated()"
    (cancelled)="showCreateModal.set(false)"
  />
}
