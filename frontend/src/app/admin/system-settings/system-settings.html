<div class="form-container">
  <gbt-card [heading]="'admin.system.heading' | transloco" icon="settings">
    @if (loading()) {
      <gbt-spinner [label]="'common.loading' | transloco" />
    } @else if (loadFailed()) {
      <p class="gbt-form-error" role="alert">{{ 'admin.system.loadFailed' | transloco }}</p>
    } @else {
      @for (field of fields; track field.key) {
        <gbt-input
          [label]="field.labelKey | transloco"
          [ngModel]="value(field.key)"
          (ngModelChange)="setValue(field.key, $event)"
          [errorMessage]="fieldError(field)"
        />
      }

      <gbt-checkbox
        [label]="'admin.system.allowRegistration' | transloco"
        [ngModel]="registrationEnabled()"
        (ngModelChange)="registrationEnabled.set($event)"
      />

      @if (showSeoIndexing()) {
        <section class="seo">
          <h3>{{ 'admin.system.seo' | transloco }}</h3>
          <gbt-checkbox
            [label]="'admin.system.allowIndexing' | transloco"
            [ngModel]="seoIndexingEnabled()"
            (ngModelChange)="seoIndexingEnabled.set($event)"
          />
          <p class="seo__hint">
            {{ 'admin.system.seoHint' | transloco }}
          </p>
        </section>
      }

      <gbt-button
        [text]="'common.save' | transloco"
        [loading]="saving()"
        [loadingLabel]="'common.loadingLabel' | transloco"
        [disabled]="hasErrors()"
        (clicked)="save()"
      />
    }
  </gbt-card>
</div>
