<div class="form-container">
  <gbt-card heading="Paramètres système" icon="settings">
    @if (loading()) {
      <gbt-spinner label="Chargement…" />
    } @else if (loadFailed()) {
      <p class="gbt-form-error" role="alert">Échec du chargement des paramètres.</p>
    } @else {
      @for (field of fields; track field.key) {
        <gbt-input
          [label]="field.label"
          [ngModel]="value(field.key)"
          (ngModelChange)="setValue(field.key, $event)"
          [errorMessage]="fieldError(field)"
        />
      }

      <gbt-checkbox
        label="Autoriser la création de compte"
        [ngModel]="registrationEnabled()"
        (ngModelChange)="registrationEnabled.set($event)"
      />

      @if (showSeoIndexing()) {
        <section class="seo">
          <h3>Référencement</h3>
          <gbt-checkbox
            label="Autoriser l'indexation par les moteurs de recherche"
            [ngModel]="seoIndexingEnabled()"
            (ngModelChange)="seoIndexingEnabled.set($event)"
          />
          <p class="seo__hint">
            Désactivée, le catalogue public envoie « noindex », le robots.txt interdit tout et le
            plan du site est vide.
          </p>
        </section>
      }

      <gbt-button
        text="Enregistrer"
        [loading]="saving()"
        loadingLabel="Chargement en cours"
        [disabled]="hasErrors()"
        (clicked)="save()"
      />
    }
  </gbt-card>
</div>
