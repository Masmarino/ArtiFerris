<gbt-modal
  [isOpen]="true"
  [heading]="'admin.organizations.new' | transloco"
  [closeLabel]="'common.close' | transloco"
  (closed)="cancelled.emit()"
>
  <form class="stack" [formGroup]="form" (ngSubmit)="submit()">
    <p class="gbt-form-required-note">{{ 'common.requiredNote' | transloco }}</p>
    <gbt-input
      [label]="'admin.organizations.subdomain' | transloco"
      formControlName="slug"
      [required]="true"
      placeholder="acme"
    />
    <gbt-input
      [label]="'common.name' | transloco"
      formControlName="displayName"
      [required]="true"
      placeholder="Acme Corp"
    />
    <gbt-button
      [text]="'common.create' | transloco"
      type="submit"
      [disabled]="form.invalid"
      [loading]="creating()"
      [loadingLabel]="'common.loadingLabel' | transloco"
    />
  </form>
</gbt-modal>
