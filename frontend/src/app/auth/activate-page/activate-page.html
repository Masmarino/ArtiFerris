<main class="auth-layout">
  <div class="auth-layout__card">
    <img
      src="/api/branding/logo"
      [alt]="'auth.login.logoAlt' | transloco"
      class="auth-layout__logo"
    />
    @if (tokenMissing) {
      <h1>{{ 'auth.activate.impossibleHeading' | transloco }}</h1>
      <gbt-alert variant="error">{{ 'auth.activate.tokenMissing' | transloco }}</gbt-alert>
    } @else {
      <h1>{{ 'auth.activate.heading' | transloco }}</h1>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <p class="gbt-form-required-note">
          {{ 'common.requiredNote' | transloco }}
        </p>
        <gbt-input
          [label]="'auth.activate.username' | transloco"
          [hint]="'auth.activate.usernameHint' | transloco"
          formControlName="username"
          [required]="true"
          autocomplete="username"
        />
        <gbt-input
          [label]="'auth.activate.newPassword' | transloco"
          type="password"
          [showPasswordLabel]="'common.showPassword' | transloco"
          [hidePasswordLabel]="'common.hidePassword' | transloco"
          formControlName="newPassword"
          [required]="true"
          autocomplete="new-password"
        />
        <gbt-input
          [label]="'auth.activate.confirmPassword' | transloco"
          type="password"
          [showPasswordLabel]="'common.showPassword' | transloco"
          [hidePasswordLabel]="'common.hidePassword' | transloco"
          formControlName="confirmPassword"
          [required]="true"
          autocomplete="new-password"
          [errorMessage]="passwordMismatch ? ('auth.activate.mismatch' | transloco) : null"
        />
        @if (errorMessage(); as message) {
          <p class="gbt-form-error" role="alert">{{ message }}</p>
        }
        <gbt-button
          [text]="'auth.activate.submit' | transloco"
          type="submit"
          [loading]="submitting()"
          [loadingLabel]="'common.loadingLabel' | transloco"
          [disabled]="form.invalid || passwordMismatch || submitting()"
        />
      </form>
    }
  </div>
</main>
