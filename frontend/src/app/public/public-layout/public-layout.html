<div class="public-layout">
  <header class="public-layout__header">
    <a
      routerLink="/explorer"
      [attr.aria-label]="'catalog.explorer.heading' | transloco"
      class="public-layout__home"
    >
      <img
        src="/api/branding/logo"
        [alt]="'auth.login.logoAlt' | transloco"
        class="public-layout__logo"
      />
    </a>
    <div
      class="public-layout__search"
      role="search"
      [attr.aria-label]="'catalog.layout.quickSearch' | transloco"
    >
      <app-suggest-search-box
        compact
        labelHidden
        [label]="'catalog.search.label' | transloco"
        [placeholder]="'catalog.layout.searchPlaceholder' | transloco"
        [maxLength]="100"
        (search)="search($event)"
      />
    </div>
    @if (isAuthenticated()) {
      <a routerLink="/repositories" class="public-layout__login-link">{{
        'catalog.layout.myRepositories' | transloco
      }}</a>
    } @else {
      <a routerLink="/login" class="public-layout__login-link">{{
        'catalog.layout.login' | transloco
      }}</a>
    }
  </header>
  <main class="public-layout__content">
    <ng-content />
  </main>
</div>
