<app-public-layout>
  @if (loading()) {
    <div class="loading-state">
      <gbt-spinner size="lg" [label]="'common.loading' | transloco" />
    </div>
  } @else if (loadError()) {
    <gbt-card>
      <p class="gbt-form-error" role="alert">{{ 'publicRepo.loadFailed' | transloco }}</p>
    </gbt-card>
  } @else if (notFound()) {
    <gbt-card>
      <p class="gbt-form-error" role="alert">{{ 'publicRepo.notFound' | transloco }}</p>
    </gbt-card>
  } @else if (repository(); as repo) {
    <gbt-card>
      <div class="public-repository-page__header">
        <h1>{{ repo.name }}</h1>
        <span class="public-repository-page__badge">{{ repo.format }}</span>
        <span class="public-repository-page__badge">{{ repo.repo_type }}</span>
      </div>
    </gbt-card>

    <gbt-card [heading]="'repositories.detail.usage' | transloco" icon="terminal">
      <app-usage-instructions
        [repository]="repo"
        apiTokenLink="/login"
        [apiTokenLinkLabel]="'auth.login.submit' | transloco"
      />
    </gbt-card>

    <gbt-card [heading]="'repositories.detail.tabs.packages' | transloco">
      <app-package-tree [repositoryId]="repo.id" [basePath]="basePath()" />
    </gbt-card>
  }
</app-public-layout>
