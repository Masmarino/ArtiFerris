<gbt-modal
  [isOpen]="true"
  [heading]="'users.create.heading' | transloco"
  [closeLabel]="'common.close' | transloco"
  (closed)="cancelled.emit()"
>
  <form class="stack" [formGroup]="form" (ngSubmit)="submit()">
    <p class="gbt-form-required-note">{{ 'common.requiredNote' | transloco }}</p>
    <gbt-input
      [label]="'users.create.username' | transloco"
      formControlName="username"
      [required]="true"
    />
    <gbt-input
      [label]="'users.create.email' | transloco"
      formControlName="email"
      [required]="true"
    />
    <p>
      {{ 'users.create.inviteNote' | transloco }}
    </p>
    <gbt-checkbox [label]="'users.create.superAdmin' | transloco" formControlName="isSuperAdmin" />
    <gbt-button
      [text]="'users.create.invite' | transloco"
      type="submit"
      [disabled]="form.invalid"
      [loading]="creating()"
      [loadingLabel]="'common.loadingLabel' | transloco"
    />
  </form>
</gbt-modal>
