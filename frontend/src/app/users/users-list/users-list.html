@if (isSuperAdmin()) {
  <div class="toolbar">
    <gbt-button [text]="'users.list.new' | transloco" (clicked)="showCreateModal.set(true)" />
    <gbt-select
      [label]="'users.list.organization' | transloco"
      [placeholder]="'common.select' | transloco"
      [options]="organizationOptions()"
      [ngModel]="selectedOrganizationId()"
      (ngModelChange)="selectedOrganizationId.set($event)"
    />
  </div>
}
@if (loading()) {
  <div class="loading-state"><gbt-spinner [label]="'common.loading' | transloco" /></div>
} @else if (error(); as message) {
  <p class="gbt-form-error" role="alert">{{ message }}</p>
  <gbt-button [text]="'common.retry' | transloco" (clicked)="reload()" />
} @else if (users().length === 0) {
  <gbt-empty-state
    illustration="folder"
    [heading]="'users.list.emptyHeading' | transloco"
    [message]="'users.list.emptyMessage' | transloco"
  >
    @if (isSuperAdmin()) {
      <gbt-button [text]="'users.list.new' | transloco" (clicked)="showCreateModal.set(true)" />
    }
  </gbt-empty-state>
} @else if (filteredUsers().length === 0) {
  <gbt-empty-state
    illustration="folder"
    [heading]="'users.list.noResultsHeading' | transloco"
    [message]="'users.list.noResultsMessage' | transloco"
  />
} @else {
  <gbt-table
    [caption]="'users.list.caption' | transloco"
    [clickableRows]="true"
    [data]="filteredUsers()"
    [columns]="columns()"
    [trackBy]="rowId"
    (rowClick)="openDetail($event)"
  />
}
@if (showCreateModal()) {
  <app-create-user-modal (created)="onUserCreated()" (cancelled)="showCreateModal.set(false)" />
}
