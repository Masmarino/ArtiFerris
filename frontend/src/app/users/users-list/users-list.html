@if (isSuperAdmin()) {
  <div class="toolbar">
    <gbt-button text="Nouvel utilisateur" (clicked)="showCreateModal.set(true)" />
    <gbt-select
      label="Organisation"
      placeholder="Sélectionner…"
      [options]="organizationOptions()"
      [ngModel]="selectedOrganizationId()"
      (ngModelChange)="selectedOrganizationId.set($event)"
    />
  </div>
}
@if (loading()) {
  <div class="loading-state"><gbt-spinner label="Chargement…" /></div>
} @else if (error(); as message) {
  <p class="gbt-form-error" role="alert">{{ message }}</p>
  <gbt-button text="Réessayer" (clicked)="reload()" />
} @else if (users().length === 0) {
  <gbt-empty-state
    illustration="folder"
    heading="Aucun utilisateur"
    message="Les utilisateurs créés ou invités apparaîtront ici."
  >
    @if (isSuperAdmin()) {
      <gbt-button text="Nouvel utilisateur" (clicked)="showCreateModal.set(true)" />
    }
  </gbt-empty-state>
} @else if (filteredUsers().length === 0) {
  <gbt-empty-state
    illustration="folder"
    heading="Aucun résultat"
    message="Aucun utilisateur dans cette organisation. Changez le filtre pour en voir d'autres."
  />
} @else {
  <gbt-table
    caption="Utilisateurs"
    [clickableRows]="true"
    [data]="filteredUsers()"
    [columns]="columns()"
    [trackBy]="rowId"
    (rowClick)="openDetail($event)"
  />
}
@if (showCreateModal()) {
  <app-create-user-modal (created)="onUserCreated()" (cancelled)="showCreateModal.set(false)" />
}
