<gbt-modal
  [isOpen]="isOpen()"
  [heading]="modalTitle()"
  [closeLabel]="'common.close' | transloco"
  (closed)="closed.emit()"
>
  <gbt-select
    [label]="'repositories.permissions.role' | transloco"
    [placeholder]="'common.select' | transloco"
    [options]="roleOptions"
    [ngModel]="selectedRole()"
    (ngModelChange)="onRoleSelect($event)"
  />
  <gbt-button
    [text]="'common.save' | transloco"
    data-testid="save-role"
    [loading]="saving()"
    (clicked)="save()"
    [loadingLabel]="'common.loadingLabel' | transloco"
  />
  <gbt-button
    [text]="'repositories.permissions.revoke' | transloco"
    variant="danger"
    data-testid="revoke"
    [loading]="saving()"
    (clicked)="revoke()"
    [loadingLabel]="'common.loadingLabel' | transloco"
  />
</gbt-modal>
