<div class="toolbar">
  <gbt-button
    [text]="
      (mode() === 'personal' ? 'repositories.list.newProject' : 'repositories.list.newRepository')
        | transloco
    "
    (clicked)="showCreateModal.set(true)"
  />
  @if (showOrganizationControls()) {
    <gbt-select
      [label]="'users.list.organization' | transloco"
      [placeholder]="'common.select' | transloco"
      [options]="organizationOptions()"
      [ngModel]="selectedOrganizationId()"
      (ngModelChange)="selectedOrganizationId.set($event)"
    />
  }
</div>
@if (loading()) {
  <div class="loading-state"><gbt-spinner [label]="'common.loading' | transloco" /></div>
} @else if (error(); as message) {
  <p class="gbt-form-error" role="alert">{{ message }}</p>
  <gbt-button [text]="'common.retry' | transloco" (clicked)="reload()" />
} @else if (repositories().length === 0) {
  <gbt-empty-state
    illustration="folder"
    [heading]="
      (mode() === 'personal' ? 'repositories.list.noProject' : 'repositories.list.noRepository')
        | transloco
    "
    [message]="
      (mode() === 'personal'
        ? 'repositories.list.noProjectMessage'
        : 'repositories.list.noRepositoryMessage'
      ) | transloco
    "
  >
    <gbt-button
      [text]="
        (mode() === 'personal' ? 'repositories.list.newProject' : 'repositories.list.newRepository')
          | transloco
      "
      (clicked)="showCreateModal.set(true)"
    />
  </gbt-empty-state>
} @else if (filteredRepositories().length === 0) {
  <gbt-empty-state
    illustration="folder"
    [heading]="'repositories.list.noResultsHeading' | transloco"
    [message]="'repositories.list.noResultsMessage' | transloco"
  />
} @else {
  <gbt-table
    [caption]="'repositories.list.caption' | transloco"
    [clickableRows]="true"
    [data]="filteredRepositories()"
    [columns]="columns()"
    [trackBy]="rowId"
    (rowClick)="openDetail($event)"
  />
}
@if (showCreateModal()) {
  @if (mode() === 'personal') {
    <app-create-user-project-modal
      (created)="onCreated()"
      (cancelled)="showCreateModal.set(false)"
    />
  } @else {
    <app-create-repository-modal (created)="onCreated()" (cancelled)="showCreateModal.set(false)" />
  }
}
