<gbt-modal [isOpen]="true" heading="Nouveau projet" closeLabel="Fermer" (closed)="cancelled.emit()">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <p class="gbt-form-required-note">Les champs marqués d'un astérisque (*) sont obligatoires.</p>
    <gbt-input label="Nom" formControlName="name" [required]="true" />
    <gbt-select label="Format" placeholder="Sélectionner…" [options]="formatOptions" formControlName="format" />
    <gbt-select label="Type" placeholder="Sélectionner…" [options]="repoTypeOptions" formControlName="repoType" />
    @if (canBePublic()) {
      <gbt-checkbox label="Rendre public" formControlName="isPublic" />
    }

    <gbt-button text="Créer" type="submit" [disabled]="form.invalid" [loading]="creating()" loadingLabel="Chargement en cours" />
  </form>
</gbt-modal>
