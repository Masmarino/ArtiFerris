# Included in every location that serves a response: add_header is not inherited once a location sets one of its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# One year, without includeSubDomains: app.artiferris.pro sets its own policy and this site has no say over it.
add_header Strict-Transport-Security "max-age=31536000" always;
include content-security-policy.conf;
