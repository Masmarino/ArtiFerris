# Runs as the unprivileged nginx user on a read-only root filesystem, so everything nginx writes goes to /tmp.
# Two workers are plenty for a static site; auto would start one per CPU of the node, whatever the pod's memory limit.
worker_processes 2;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  # The HTML declares its charset, but robots.txt and sitemap.xml do not.
  charset       utf-8;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  server_tokens off;

  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
  gzip_min_length 1024;

  # Language of the visitor: the first Accept-Language tag the site is translated into (fr, fr-CA and "ja,fr;q=0.8" all
  # give fr). Tags with q=0 are skipped, but q values don't reorder the list: browsers already send it in preference
  # order. Otherwise en. Keep the list in step with `languages` in the site.
  map $http_accept_language $lang {
    default en;
    "~*^(?:[^,]*,)*?\s*(?<first>en|fr|it|es|de)(?:-[a-z0-9-]+)?\s*(?:;\s*q=(?:1(?:\.0*)?|0?\.0*[1-9][0-9]*))?\s*(?:,|$)" $first;
  }

  # Cache lifetime of everything but the hashed bundles (they have their own location). Pages, sitemap and robots.txt
  # change with every release under the same URL, so they are always revalidated (ETag and Last-Modified). Images and
  # icons keep their names when they change, so a day is the longest they may be kept without asking.
  map $uri $cache_control {
    default "no-cache";
    "~*\.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?)$" "public, max-age=86400";
  }

  # The apex domain only redirects to the site.
  server {
    listen 8080;
    server_name artiferris.pro;

    location / {
      add_header Cache-Control "no-cache";
      include security-headers.conf;
      return 301 https://www.artiferris.pro$request_uri;
    }
  }

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects use a relative Location: behind the ingress, nginx sees plain http on whatever host the probes use.
    absolute_redirect off;

    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    # Probes. Not logged: they would drown the access log.
    location = /healthz {
      access_log off;
      default_type text/plain;
      add_header Cache-Control "no-store";
      return 200 "ok\n";
    }

    # The root is not a page: send the visitor to the site in their language.
    location = / {
      add_header Vary "Accept-Language" always;
      add_header Cache-Control "no-store";
      include security-headers.conf;
      return 302 /$lang/;
    }

    # A page of the site without its language (/features/): same, keeping the path and the query.
    location ~ ^/(?:features|ci|install|security|roadmap)(?:/|$) {
      add_header Vary "Accept-Language" always;
      add_header Cache-Control "no-store";
      include security-headers.conf;
      return 302 /$lang$request_uri;
    }

    # /fr or /fr/features: pages are directories, so give them their canonical URL with the trailing slash (the relative
    # links of the pages depend on it). A path that is not a page falls through to the 404.
    location ~ ^(?<page>/(?:en|fr|it|es|de)(?:/[^/.]+)*)$ {
      if (!-f $document_root$page/index.html) {
        return 404;
      }
      add_header Cache-Control "no-cache";
      include security-headers.conf;
      return 301 $page/$is_args$args;
    }

    # Bundles and fonts have an 8-character content hash in their name (main-TY244YL4.js, chunk-ABlkRMFU.js), so they
    # never change under the same URL. theme-init.js has none and is revalidated like a page.
    location ~ "-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?)$" {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
      include security-headers.conf;
    }

    location / {
      try_files $uri $uri/index.html =404;
      add_header Cache-Control $cache_control;
      include security-headers.conf;
    }

    error_page 404 /404.html;
    location = /404.html {
      internal;
      # `always`, otherwise add_header skips error statuses.
      add_header Cache-Control "no-cache" always;
      include security-headers.conf;
    }
  }
}
