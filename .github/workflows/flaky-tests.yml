name: Flaky tests

# Runs each suite again and again on a busy machine, where timing assumptions break, and names the tests that
# did not pass every time. It never retries: a test that passed only the second time is what it looks for.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      runs:
        description: "How many times each suite is run"
        default: "5"
        required: false

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"
  NODE_VERSION: "26"
  RUNS: ${{ github.event.inputs.runs || '5' }}

jobs:
  frontend:
    name: Frontend, repeated under load
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Test, several times, with every core busy
        run: |
          # As many spinning processes as cores: the tests share the machine, as they do when a PR run is busy.
          for _ in $(seq "$(nproc)"); do (timeout 5400 sh -c 'while :; do :; done' &); done
          failed=0
          for run in $(seq "$RUNS"); do
            npm test -- --watch=false > "run-$run.log" 2>&1 || { failed=$((failed + 1)); echo "::warning::run $run failed"; }
          done
          pkill -f 'while :; do :; done' || true
          {
            echo "## Frontend: $failed of $RUNS runs failed"
            grep -h ' FAIL ' run-*.log | sed 's/\x1b\[[0-9;]*m//g' | sort | uniq -c | sort -rn
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

  backend:
    name: Backend, repeated under load
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:18-alpine3.24@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-06
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build the tests
        run: cargo test --workspace --locked --no-run

      - name: Test, several times, with two cores busy
        run: |
          for _ in 1 2; do (timeout 10000 sh -c 'while :; do :; done' &); done
          failed=0
          for run in $(seq "$RUNS"); do
            cargo test --workspace --locked --no-fail-fast > "run-$run.log" 2>&1 || { failed=$((failed + 1)); echo "::warning::run $run failed"; }
          done
          pkill -f 'while :; do :; done' || true
          {
            echo "## Backend: $failed of $RUNS runs failed"
            grep -h -E '^test .* \.\.\. FAILED$' run-*.log | sort | uniq -c | sort -rn
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
