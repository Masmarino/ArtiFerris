name: CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "release/**"
    tags: ["v*.*.*"]
  # No branch filter here — PRs always just build+test; scan/docker build only happen on a direct push.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only runs that never publish are superseded: a push to main or a tag can be mid-`docker push`, and cancelling it would leave `latest` and `sha-*` pointing at different images.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # keep in sync with rust-toolchain.toml — that's the real source of truth
  RUST_VERSION: "1.98.1"
  NODE_VERSION: "26"
  DOCKER_IMAGE: masmarino/artiferris

jobs:
  # ── Build & test ────────────────────────────────────────────────────────

  test-backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Offline mode checks queries against the committed .sqlx cache — but sqlx::test still spins up a real (ephemeral) postgres per test.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-06
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

  test-frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build (production)
        run: npm run build -- --configuration production

      - name: Test
        run: npm test -- --watch=false

  # ── Security scan: source & dependencies ───────────────────────────────
  # Runs on every PR plus pushes to develop/main/release*/tags. feature/fix branches just get build+test until they open a PR.

  security-scan-source:
    name: Security scan (source & dependencies)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/develop' ||
        startsWith(github.ref, 'refs/heads/release/') ||
        startsWith(github.ref, 'refs/tags/v')))
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-06
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # Trivy/Grype only flag a vuln once indexed against the crate version — cargo-audit covers the gap by reading the RUSTSEC feed directly.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: cargo audit
        id: cargo-audit
        continue-on-error: true
        # The one accepted advisory (RUSTSEC-2023-0071, RSA Marvin attack) and why is in .cargo/audit.toml.
        run: cargo audit

      - name: Trivy filesystem scan
        id: trivy-fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF
        if: always()
        # This upload can fail on its own (e.g. Advanced Security disabled) — not a reason to fail the job; the explicit check below is what actually gates it.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-source

      - name: Grype source scan
        id: grype-fs
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        continue-on-error: true
        with:
          path: "."
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          only-fixed: true

      - name: Upload Grype SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.grype-fs.outputs.sarif }}
          category: grype-source

      - name: Fail if HIGH/CRITICAL vulnerabilities were found
        if: steps.trivy-fs.outcome == 'failure' || steps.grype-fs.outcome == 'failure' || steps.cargo-audit.outcome == 'failure'
        run: |
          echo "Trivy, Grype and/or cargo audit found vulnerabilities in source dependencies."
          echo "See the job log (cargo audit) and the Security tab (Trivy/Grype) for details."
          exit 1

  # ── Tag guard ───────────────────────────────────────────────────────────
  # Anyone who can push a tag could otherwise publish any commit, from any branch, under a release tag. Runs before anything is built or pushed.

  verify-tag:
    name: Require the tagged commit to be on main
    runs-on: ubuntu-latest
    # Runs on every push (a no-op outside tags) so that build-and-push can depend on it without being skipped along with it.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main, refusing to publish it"; exit 1; }

  # ── Build, scan & (conditionally) push the Docker image ────────────────
  # Built once, scanned, then pushed as-is (never rebuilt) if it's main or a version tag. release/* just builds+scans as a release-candidate check, never pushed.

  build-and-push:
    name: Build, scan & push Docker image
    runs-on: ubuntu-latest
    needs: [security-scan-source, verify-tag]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/release/') ||
       startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      security-events: write
    env:
      IS_PUBLISHABLE: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (local only — not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        id: trivy-image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-image-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Upload Trivy image SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Grype image scan
        id: grype-image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        continue-on-error: true
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          only-fixed: true

      - name: Upload Grype image SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.grype-image.outputs.sarif }}
          category: grype-image

      - name: Fail if the built image has HIGH/CRITICAL vulnerabilities
        if: steps.trivy-image.outcome == 'failure' || steps.grype-image.outcome == 'failure'
        run: |
          echo "Trivy and/or Grype found HIGH/CRITICAL vulnerabilities in the built image."
          echo "See the Security tab for details. Not pushing to Docker Hub."
          exit 1

      - name: Log in to Docker Hub
        if: env.IS_PUBLISHABLE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the scanned image under all its tags
        if: env.IS_PUBLISHABLE == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$TAGS"

      # The registry's own digest for what was just pushed: the deploy job pins the release to it, so a tag moved afterwards changes nothing.
      - name: Resolve the pushed image digest
        id: digest
        if: env.IS_PUBLISHABLE == 'true'
        env:
          FIRST_TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          digest=$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # ── Deploy: upgrade the production release to the just-pushed image, by digest ──
  # Only on a version tag, and only when the tagged commit is on main (checked again here, and before the image is published); main/release builds stop at the registry push above.

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    # Two deploys never run at once, and a running one is never cancelled halfway through a helm upgrade.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Anyone who can push a tag could otherwise ship any commit, from any branch, to production.
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main, refusing to deploy it"; exit 1; }

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Write kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig.yaml"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig.yaml"

      - name: helm upgrade --install
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig.yaml
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
          # The ingress controller's pod CIDR(s), comma-separated; the chart refuses to render without it.
          TRUSTED_PROXY_IPS: ${{ vars.TRUSTED_PROXY_IPS }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest from the build job"; exit 1; }
          # A values file, not --set: commas in the list would be parsed as separate keys.
          jq -n --arg ips "$TRUSTED_PROXY_IPS" '{artiferris: {trustedProxyIps: $ips}}' > "$RUNNER_TEMP/values-ci.json"
          # --atomic rolls the release back when the upgrade fails. Database migrations already applied are not undone: see "Upgrading" in the README.
          helm upgrade --install artiferris ./helm/artiferris \
            --namespace artiferris --create-namespace \
            --values "$RUNNER_TEMP/values-ci.json" \
            --set image.repository="$DOCKER_IMAGE" \
            --set image.tag="$IMAGE_TAG" \
            --set image.digest="$IMAGE_DIGEST" \
            --atomic --cleanup-on-fail --timeout 10m
