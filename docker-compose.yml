services:
  postgres:
    image: postgres:18-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: artiferris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: artiferris
    volumes:
      # postgres:18+ keeps its data in a version-specific subdirectory under this one mount: the old .../data path
      # makes the entrypoint refuse to start (docker-library/postgres#1259).
      - artiferris-postgres-data:/var/lib/postgresql
    ports:
      # Loopback only, for a backend run locally (scripts/dev.sh); artiferris-api reaches Postgres over the compose network.
      # Never publish it on all interfaces.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artiferris"]
      interval: 5s
      timeout: 5s
      retries: 10

  artiferris-api:
    build: .
    restart: unless-stopped
    # Same hardening as the Helm chart: nothing to escalate to, nothing writable but /data and /tmp.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    # Large transfers are buffered in memory (up to the 2 GiB and 200 MiB body limits), so a few concurrent ones could exhaust the host.
    # This caps the damage to the container; raise it if legitimate traffic gets OOM-killed.
    deploy:
      resources:
        limits:
          memory: ${ARTIFERRIS_API_MEMORY_LIMIT:-4g}
    environment:
      # The password goes in as is: URL-safe characters only (`openssl rand -hex 24`).
      DATABASE_URL: postgres://artiferris:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/artiferris
      # Size it against expected concurrent users: each held connection is one in-flight request, and the others queue for 10 s.
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?SECRETS_ENCRYPTION_KEY must be set — generate one with `openssl rand -base64 32`}
      # Only while rotating SECRETS_ENCRYPTION_KEY. See the README.
      SECRETS_ENCRYPTION_KEY_PREVIOUS: ${SECRETS_ENCRYPTION_KEY_PREVIOUS:-}
      # `true` rewrites stored secrets in the current format or under the new key. Read "Upgrades and encryption key rotation" in the README first.
      SECRETS_REENCRYPT_LEGACY: ${SECRETS_REENCRYPT_LEGACY:-}
      ARTIFERRIS_BASE_DOMAIN: ${ARTIFERRIS_BASE_DOMAIN:?ARTIFERRIS_BASE_DOMAIN must be set}
      # The URL clients reach this deployment at: Docker token realm, HSTS, passkeys, canonical URLs. Never 0.0.0.0.
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL must be set, e.g. https://app.artiferris.example.com}
      # Private ranges LDAP, SMTP, OIDC and proxy hosts may resolve to. See .env.example.
      ARTIFERRIS_SSRF_ALLOWED_CIDRS: ${ARTIFERRIS_SSRF_ALLOWED_CIDRS:-}
      STORAGE_ROOT: /data
      BIND_ADDR: 0.0.0.0:8080
      # Without RUST_LOG the container logs almost nothing.
      RUST_LOG: ${RUST_LOG:-info}
      # Creates an account only when the users table is empty. Without it there is no first admin.
      ARTIFERRIS_BOOTSTRAP_ADMIN_USERNAME: ${ARTIFERRIS_BOOTSTRAP_ADMIN_USERNAME:-}
      ARTIFERRIS_BOOTSTRAP_ADMIN_PASSWORD: ${ARTIFERRIS_BOOTSTRAP_ADMIN_PASSWORD:-}
      # The addresses a reverse proxy connects from, so their X-Forwarded-For is believed. See .env.example.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      # Days audit events are kept; 0 keeps everything. See .env.example.
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      # Leave empty: the realm comes from the request. See .env.example.
      ARTIFERRIS_DOCKER_TOKEN_REALM: ${ARTIFERRIS_DOCKER_TOKEN_REALM:-}
      # The root filesystem is read-only: Trivy caches its database here.
      TRIVY_CACHE_DIR: /tmp/trivy-cache
    ports:
      - "8080:8080"
    volumes:
      # The image runs as a non-root user, and Docker only sets this volume's ownership when it creates it. After upgrading from an
      # image that ran as root, fix it once with:
      #   docker compose run --rm --user root artiferris-api chown -R artiferris:artiferris /data
      - artiferris-storage:/data

volumes:
  artiferris-postgres-data:
  artiferris-storage:
