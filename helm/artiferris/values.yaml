image:
  repository: masmarino/artiferris
  # Required: a release tag such as 1.4.2. `latest` works but is always pulled.
  tag: ""
  # Optional sha256:... digest: the pod then runs exactly that image.
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 4Gi

# 100/101 are the ids the image pins for its `artiferris` user; they must match the Dockerfile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# The app writes only to /data (the volume) and /tmp (an emptyDir).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

networkPolicy:
  # Only the ArtiFerris pod may open connections to Postgres. Needs a CNI that enforces NetworkPolicy.
  enabled: true
  # Who may reach the ArtiFerris pod, as NetworkPolicy peers. Empty means anyone; an ingress controller in another
  # namespace needs its namespace named here.
  appIngressFrom: []
  # Only ingress is restricted. Outbound connections (LDAP, SMTP, OIDC, proxied registries, npm advisories) are limited only by
  # the outbound-request guard; add an egress policy if your cluster needs one.

persistence:
  # Keeps both volumes (registry data and database) on uninstall. Delete the PVCs by hand to wipe the data.
  keepOnUninstall: true

storage:
  # Registry storage (Docker layers, npm tarballs): grows with usage.
  size: 20Gi
  storageClassName: "" # empty = cluster default

ingress:
  enabled: true
  host: app.artiferris.pro
  wildcardHost: "*.artiferris.pro"
  clusterIssuer: artiferris-dns01-issuer
  # Traefik Middlewares (name@kubernetescrd, comma-separated) that must already exist: https redirect, security headers, rate
  # limiting. Empty uses none. The ingress also refers to a Traefik TLSOption named traefik-mintls13 (TLS 1.3 minimum).
  middlewares: "traefik-https@kubernetescrd,traefik-headers@kubernetescrd,traefik-ratelimit@kubernetescrd"

artiferris:
  baseDomain: artiferris.pro
  bootstrapAdminUsername: admin
  rustLog: info
  # Leave unset: the Docker token realm is derived per request. Setting it pins every client to one realm and breaks
  # Docker auth on every other subdomain.
  dockerTokenRealmOverride: ""
  # The ingress controller's pod network, as comma-separated CIDRs (e.g. "10.42.0.0/16"). Only requests from it get their
  # X-Forwarded-For believed. Empty, every visitor looks like the ingress pod: ten failed logins lock everyone out and the
  # public catalog budget is shared by the whole internet. With ingress.enabled the chart refuses to render while it is
  # empty, unless allowSharedThrottleBucket is true. Several CIDRs on the command line:
  # --set-string artiferris.trustedProxyIps='10.42.0.0/16\,10.43.0.0/16', or use a values file.
  trustedProxyIps: ""
  # Accept an empty trustedProxyIps behind the ingress (one shared throttle bucket for every visitor).
  allowSharedThrottleBucket: false
  # Requests per minute and client for anonymous npm and Docker reads; "0" turns the limit off. A request with a token
  # is never counted. Clients behind one address (a CI farm) share it.
  anonymousRegistryReadsPerMinute: "1200"
  # Days audit events are kept (daily sweep); package, repository and permission events are never deleted. "0" keeps everything.
  auditRetentionDays: "365"
  # Rewrites stored secrets in the current format, and under a new secrets.secretsEncryptionKey after a rotation, at startup.
  # Leave it false until the upgrade is verified: earlier releases cannot read the rewritten values. Rolling back after the
  # migrations ran needs a database restore either way (README, "Upgrades and encryption key rotation").
  reencryptStoredSecrets: false

postgres:
  image: postgres:18-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
  # 70 is the postgres user of the alpine image.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  storage:
    size: 10Gi
    storageClassName: "" # empty = cluster default
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# Left empty, Helm generates each of these on first install (templates/secret.yaml) and finds them again on upgrade with
# `lookup`. Under `helm template`, `--dry-run`, Argo CD or Flux `lookup` returns nothing and every render would invent new
# values (a database password nobody knows, an encryption key that makes stored secrets unreadable): set all of these
# yourself. The Secret carries `helm.sh/resource-policy: keep`.
# Rotating the key: set secretsEncryptionKey to the new value, secretsEncryptionKeyPrevious to the old one and
# artiferris.reencryptStoredSecrets to true, upgrade, then remove the Previous key. See the README.
secrets:
  postgresPassword: ""
  jwtSecret: ""
  secretsEncryptionKey: ""
  # Only while rotating; dropped from the Secret once removed from the values.
  secretsEncryptionKeyPrevious: ""
  bootstrapAdminPassword: ""
