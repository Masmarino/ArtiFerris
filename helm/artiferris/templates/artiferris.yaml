apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-storage
  labels:
    {{- include "artiferris.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storage.storageClassName }}
  storageClassName: {{ .Values.storage.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "artiferris.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate # single ReadWriteOnce volume — a rolling update would deadlock on the second pod
  selector:
    matchLabels:
      {{- include "artiferris.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "artiferris.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: artiferris-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: JWT_SECRET
            - name: SECRETS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: SECRETS_ENCRYPTION_KEY
            - name: ARTIFERRIS_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.artiferris.bootstrapAdminUsername | quote }}
            - name: ARTIFERRIS_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ARTIFERRIS_BOOTSTRAP_ADMIN_PASSWORD
            - name: ARTIFERRIS_BASE_DOMAIN
              value: {{ .Values.artiferris.baseDomain | quote }}
            {{- if .Values.artiferris.dockerTokenRealmOverride }}
            - name: ARTIFERRIS_DOCKER_TOKEN_REALM
              value: {{ .Values.artiferris.dockerTokenRealmOverride | quote }}
            {{- end }}
            - name: PUBLIC_URL
              value: {{ include "artiferris.publicUrl" . | quote }}
            - name: STORAGE_ROOT
              value: /data
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: RUST_LOG
              value: {{ .Values.artiferris.rustLog | quote }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: storage
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-storage
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "artiferris.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "artiferris.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8080
