{{- if and .Values.ingress.enabled (not (include "artiferris.trustedProxyIps" .)) (not .Values.artiferris.allowSharedThrottleBucket) }}
{{- fail "artiferris.trustedProxyIps is empty or blank: behind the ingress every visitor would share one login and public-catalog throttle bucket. Set it to the ingress controller's pod CIDR(s), e.g. --set-string artiferris.trustedProxyIps=10.42.0.0/16 (escape commas as \\, between several), or set artiferris.allowSharedThrottleBucket=true to accept the shared bucket." }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-storage
  labels:
    {{- include "artiferris.labels" . | nindent 4 }}
  {{- if .Values.persistence.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storage.storageClassName }}
  storageClassName: {{ .Values.storage.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "artiferris.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate # single ReadWriteOnce volume — a rolling update would deadlock on the second pod
  selector:
    matchLabels:
      {{- include "artiferris.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "artiferris.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: artiferris-api
          image: {{ include "artiferris.image" . | quote }}
          imagePullPolicy: {{ include "artiferris.pullPolicy" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: JWT_SECRET
            - name: SECRETS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: SECRETS_ENCRYPTION_KEY
            {{- if .Values.secrets.secretsEncryptionKeyPrevious }}
            - name: SECRETS_ENCRYPTION_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: SECRETS_ENCRYPTION_KEY_PREVIOUS
            {{- end }}
            - name: SECRETS_REENCRYPT_LEGACY
              value: {{ .Values.artiferris.reencryptStoredSecrets | quote }}
            - name: ARTIFERRIS_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.artiferris.bootstrapAdminUsername | quote }}
            - name: ARTIFERRIS_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: ARTIFERRIS_BOOTSTRAP_ADMIN_PASSWORD
            - name: ARTIFERRIS_BASE_DOMAIN
              value: {{ .Values.artiferris.baseDomain | quote }}
            {{- if .Values.artiferris.dockerTokenRealmOverride }}
            - name: ARTIFERRIS_DOCKER_TOKEN_REALM
              value: {{ .Values.artiferris.dockerTokenRealmOverride | quote }}
            {{- end }}
            - name: PUBLIC_URL
              value: {{ include "artiferris.publicUrl" . | quote }}
            {{- if include "artiferris.trustedProxyIps" . }}
            - name: TRUSTED_PROXY_IPS
              value: {{ include "artiferris.trustedProxyIps" . | quote }}
            {{- end }}
            - name: AUDIT_RETENTION_DAYS
              value: {{ .Values.artiferris.auditRetentionDays | quote }}
            - name: STORAGE_ROOT
              value: /data
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: RUST_LOG
              value: {{ .Values.artiferris.rustLog | quote }}
            # The root filesystem is read-only: Trivy caches its database here.
            - name: TRIVY_CACHE_DIR
              value: /tmp/trivy-cache
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: storage
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          # Migrations and the secret check run before the port opens: liveness starts once this has passed.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-storage
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "artiferris.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "artiferris.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8080
