{{- $secretName := printf "%s-secrets" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $postgresPassword := "" }}
{{- $jwtSecret := "" }}
{{- $encryptionKey := "" }}
{{- $bootstrapAdminPassword := "" }}
{{- if $existing }}
{{- $postgresPassword = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- $jwtSecret = index $existing.data "JWT_SECRET" | b64dec }}
{{- /* An explicit value wins over the stored one: that is how a rotation supplies the new key. */ -}}
{{- $encryptionKey = .Values.secrets.secretsEncryptionKey | default (index $existing.data "SECRETS_ENCRYPTION_KEY" | b64dec) }}
{{- $bootstrapAdminPassword = index $existing.data "ARTIFERRIS_BOOTSTRAP_ADMIN_PASSWORD" | b64dec }}
{{- else }}
{{- $postgresPassword = .Values.secrets.postgresPassword | default (randAlphaNum 32) }}
{{- $jwtSecret = .Values.secrets.jwtSecret | default (randAlphaNum 48) }}
{{- $encryptionKey = .Values.secrets.secretsEncryptionKey | default (randAlphaNum 48) }}
{{- $bootstrapAdminPassword = .Values.secrets.bootstrapAdminPassword | default (randAlphaNum 18) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "artiferris.labels" . | nindent 4 }}
  annotations:
    # Losing this Secret loses the database login and the key every stored secret is encrypted with.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  JWT_SECRET: {{ $jwtSecret | quote }}
  SECRETS_ENCRYPTION_KEY: {{ $encryptionKey | quote }}
  {{- if .Values.secrets.secretsEncryptionKeyPrevious }}
  SECRETS_ENCRYPTION_KEY_PREVIOUS: {{ .Values.secrets.secretsEncryptionKeyPrevious | quote }}
  {{- end }}
  ARTIFERRIS_BOOTSTRAP_ADMIN_PASSWORD: {{ $bootstrapAdminPassword | quote }}
  # Built here rather than as a $(POSTGRES_PASSWORD) reference in the Deployment: Kubernetes expands $(VAR) only in plain
  # `value:` variables, never in secretKeyRef ones. The password is percent-encoded (urlquery writes a space as `+`).
  DATABASE_URL: {{ printf "postgres://artiferris:%s@%s-postgres:5432/artiferris" ($postgresPassword | urlquery | replace "+" "%20") .Release.Name | quote }}
