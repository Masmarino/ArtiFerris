{{- $secretName := printf "%s-secrets" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $postgresPassword := "" }}
{{- $jwtSecret := "" }}
{{- $encryptionKey := "" }}
{{- $bootstrapAdminPassword := "" }}
{{- if $existing }}
{{- $postgresPassword = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- $jwtSecret = index $existing.data "JWT_SECRET" | b64dec }}
{{- $encryptionKey = index $existing.data "SECRETS_ENCRYPTION_KEY" | b64dec }}
{{- $bootstrapAdminPassword = index $existing.data "ARTIFERRIS_BOOTSTRAP_ADMIN_PASSWORD" | b64dec }}
{{- else }}
{{- $postgresPassword = .Values.secrets.postgresPassword | default (randAlphaNum 32) }}
{{- $jwtSecret = .Values.secrets.jwtSecret | default (randAlphaNum 48) }}
{{- $encryptionKey = .Values.secrets.secretsEncryptionKey | default (randAlphaNum 48) }}
{{- $bootstrapAdminPassword = .Values.secrets.bootstrapAdminPassword | default (randAlphaNum 18) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "artiferris.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  JWT_SECRET: {{ $jwtSecret | quote }}
  SECRETS_ENCRYPTION_KEY: {{ $encryptionKey | quote }}
  ARTIFERRIS_BOOTSTRAP_ADMIN_PASSWORD: {{ $bootstrapAdminPassword | quote }}
  # Built here, not via a $(POSTGRES_PASSWORD) reference in the Deployment's env — Kubernetes
  # only expands $(VAR) references against plain `value:` vars, never against secretKeyRef ones,
  # so that reference would resolve to the literal string instead of the password.
  DATABASE_URL: {{ printf "postgres://artiferris:%s@%s-postgres:5432/artiferris" $postgresPassword .Release.Name | quote }}
