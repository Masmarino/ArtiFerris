[package]
name = "bunker-npm"
version = "0.1.0"
edition.workspace = true

[dependencies]
bunker-domain = { path = "../bunker-domain" }
bunker-application = { path = "../bunker-application" }
bunker-infrastructure = { path = "../bunker-infrastructure" }
axum = "0.8"
bytes = "1"
axum-extra = { version = "0.12", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tower-http = { version = "0.7", features = ["decompression-gzip"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
tempfile = "3"
