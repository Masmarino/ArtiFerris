[package]
name = "artiferris-infrastructure"
version = "0.5.0"
edition.workspace = true

[dependencies]
artiferris-domain = { path = "../artiferris-domain" }
artiferris-application = { path = "../artiferris-application" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros", "json"] }
argon2 = "0.6"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
tokio = { version = "1", features = ["fs", "rt", "process", "sync", "time"] }
reqwest = { version = "0.13.4", features = ["json", "query", "stream"] }
libc = "0.2"
sha2 = "0.11.0"
rand = "0.10.2"
aes-gcm = "0.11.1"
hex = "0.4.3"
hkdf = "0.13"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
tracing = "0.1"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
openidconnect = "4"
futures-util = "0.3"
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
pulldown-cmark = "0.13.4"
ammonia = "4.2.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
