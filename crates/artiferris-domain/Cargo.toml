[package]
name = "artiferris-domain"
version = "0.6.0"
edition.workspace = true

[dependencies]
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
sha2 = "0.11.0"
hex = "0.4.3"
bytes = "1"
futures-core = "0.3"
# Already resolved transitively via reqwest (artiferris-infrastructure) — no new dependency tree
# added, just a direct edge to a crate that's already pinned by the workspace. Used only for
# RFC 3986 URL-shape validation (scheme + parseability) at aggregate-definition time; no I/O.
url = "2"
